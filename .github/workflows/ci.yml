name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `npm run lint` reaches editors/, whose types come from its own packages.
      - run: npm ci
        working-directory: editors
      # 47 MB from a GitHub release, pinned in the fetch tool, so key the
      # cache on that tool: change the version, get a new key, download once.
      - uses: actions/cache@v4
        with:
          path: public/vendor/abi
          key: abi-module-${{ hashFiles('tools/fetch-abi-module.mjs') }}
      - uses: actions/cache@v4
        with:
          path: public/vendor/hylo
          key: hylo-module-${{ hashFiles('tools/fetch-hylo-module.mjs') }}
      # The layout modules the site serves. Everything past this point (the
      # unit suites that drive them, the build, the e2e run) uses the same
      # copies, so a release that changed an answer fails here rather than in
      # production. `npm run build` would fetch them anyway; doing it up front
      # means the test suites see them too.
      - name: Fetch the clang-abi-wasm release
        run: npm run abi:fetch
      # Optional: a build with no Hylo module offers the language as
      # unsupported, and the Hylo end-to-end tests skip themselves.
      - name: Fetch the hylo-abi-wasm release
        run: npm run hylo:fetch
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      # The share-link package on its own: what `npm run check` and `npm test`
      # above see is its source through an alias, and what is published is
      # `dist` built by the package's own tsconfig.
      - run: npm run build --workspaces
      - run: npm test --workspaces
      # What JSR will say to the package as it is: its own type and export checks.
      - run: npx jsr publish --dry-run --allow-dirty
        working-directory: packages/share-link

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 47 MB from a GitHub release, pinned in the fetch tool, so key the
      # cache on that tool: change the version, get a new key, download once.
      - uses: actions/cache@v4
        with:
          path: public/vendor/abi
          key: abi-module-${{ hashFiles('tools/fetch-abi-module.mjs') }}
      - uses: actions/cache@v4
        with:
          path: public/vendor/hylo
          key: hylo-module-${{ hashFiles('tools/fetch-hylo-module.mjs') }}
      - run: npm run abi:fetch
      - run: npm run hylo:fetch
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (Playwright, production build)
        run: PW_CHANNEL=chromium npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  # The editor plugins (editors/): the shared language server, the panel and
  # the VS Code extension, type-checked, formatted and tested against the real
  # engine; the Neovim colours run in a real Neovim.
  editors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/package-lock.json
      - uses: actions/cache@v4
        with:
          path: public/vendor/abi
          key: abi-module-${{ hashFiles('tools/fetch-abi-module.mjs') }}
      # The integration tests run the engine from the web app's copy.
      - run: node tools/fetch-abi-module.mjs
        working-directory: .
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run package -w vscode
      - uses: actions/upload-artifact@v7
        with:
          name: abi-explorer-vsix
          path: editors/vscode/dist/abi-explorer.vsix

  # The CLion plugin against the real IntelliJ Platform (downloaded by Gradle),
  # with the server and panel bundles it carries; and the Zed extension's wasm.
  editor-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          # Downloading CLion to build against is most of this job.
          cache: gradle
      - run: npm ci && npm run build
        working-directory: editors
      - run: ./gradlew -p core test
        working-directory: editors/clion
      - run: ./gradlew buildPlugin
        working-directory: editors/clion
      - run: rustup target add wasm32-wasip2 && cargo build --release --target wasm32-wasip2
        working-directory: editors/zed
      - uses: actions/upload-artifact@v7
        with:
          name: abi-explorer-clion
          path: editors/clion/build/distributions/*.zip
