name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The layout module the site serves. Everything past this point — the
      # build, the real-clang suites, the e2e run — uses the same copy, so a
      # release that changed an answer fails here rather than in production.
      - name: Fetch the clang-abi-wasm release
        run: npm run abi:fetch
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run abi:fetch
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (Playwright, production build)
        run: PW_CHANNEL=chromium npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
