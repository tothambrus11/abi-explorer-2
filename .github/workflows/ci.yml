name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `npm run lint` reaches editors/, whose types come from its own packages.
      - run: npm ci
        working-directory: editors
      # 47 MB from a GitHub release, pinned in the fetch tool, so key the
      # cache on that tool: change the version, get a new key, download once.
      - uses: actions/cache@v4
        with:
          path: public/vendor/abi
          key: abi-module-${{ hashFiles('tools/fetch-abi-module.mjs') }}
      - uses: actions/cache@v4
        with:
          path: public/vendor/hylo
          key: hylo-module-${{ hashFiles('tools/fetch-hylo-module.mjs') }}
      # The layout modules the site serves. Everything past this point (the
      # unit suites that drive them, the build, the e2e run) uses the same
      # copies, so a release that changed an answer fails here rather than in
      # production. `npm run build` would fetch them anyway; doing it up front
      # means the test suites see them too.
      - name: Fetch the clang-abi-wasm release
        run: npm run abi:fetch
      # Optional: a build with no Hylo module offers the language as
      # unsupported, and the Hylo end-to-end tests skip themselves.
      - name: Fetch the hylo-abi-wasm release
        run: npm run hylo:fetch
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      # The share-link package on its own: what `npm run check` and `npm test`
      # above see is its source through an alias, and what is published is
      # `dist` built by the package's own tsconfig.
      - run: npm run build --workspaces
      - run: npm test --workspaces
      # What JSR will say to the package as it is: its own type and export checks.
      - run: npx jsr publish --dry-run --allow-dirty
        working-directory: packages/share-link

  # Whether a pull request touches the web app at all; one that only changes
  # editors/ (which the Editors release workflow builds and tests) skips e2e,
  # except editors/shared/, whose reorder warning the app shows too.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only "$BASE" HEAD)
          fi
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            grep -qvE '^(editors/|\.github/workflows/editors-release\.yml$)' <<< "$changed" ||
            grep -q '^editors/shared/' <<< "$changed"; then
            echo web=true >> "$GITHUB_OUTPUT"
          else
            echo web=false >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

  # Independent of `check`, and split over three runners: each builds the site
  # and runs a third of the suite.
  e2e-shard:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: e2e (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 47 MB from a GitHub release, pinned in the fetch tool, so key the
      # cache on that tool: change the version, get a new key, download once.
      - uses: actions/cache@v4
        with:
          path: public/vendor/abi
          key: abi-module-${{ hashFiles('tools/fetch-abi-module.mjs') }}
      - uses: actions/cache@v4
        with:
          path: public/vendor/hylo
          key: hylo-module-${{ hashFiles('tools/fetch-hylo-module.mjs') }}
      - run: npm run abi:fetch
      - run: npm run hylo:fetch
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (Playwright, production build)
        run: PW_CHANNEL=chromium npx playwright test --shard=${{ matrix.shard }}/3
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report

  # One check named e2e for all shards, passing when they pass or were skipped.
  e2e:
    needs: [changes, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$CHANGES" = success && { test "$SHARDS" = success || test "$SHARDS" = skipped; }
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.e2e-shard.result }}
