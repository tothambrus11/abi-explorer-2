# The plugin's version: the same as every other editor's (editors/scripts/version.mjs).
pluginVersion = 0.2.1
# The oldest CLion the plugin supports, and the one built against: 2025.3.1, the first
# with the com.intellij.modules.jcef alias the tool window depends on (2025.3 itself is
# 253.28294, so 253.28295 leaves it out).
platformVersion = 2025.3.1
sinceBuild = 253.28295
# The newest CLion release, which CI verifies and smoke-tests the plugin in as well
# (`./gradlew verifyPlugin -PverifyNewest=true`, `./gradlew test -PplatformVersion=2026.2`).
newestPlatformVersion = 2026.2
kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
